name: AegisAC
version: 0.3.0-alpha
main: dev.aegisac.core.AegisAC
api-version: '1.21.11'
author: _adam814
description: Conservative alert-first anti-cheat for Paper 1.21.11.
commands:
  aegis:
    description: AegisAC administration command
    usage: /aegis <alerts|status|debug|enforcement|ipban|inspect|reset|pardon|unban-ip|reload|info>
    permission: aegis.admin
  aegis-ip:
    description: Show the server-seen IP address of an online player
    usage: /aegis-ip <online-player>
    permission: aegis.ip
permissions:
  aegis.admin:
    description: Access to AegisAC commands
    default: op
  aegis.alerts:
    description: Receive AegisAC alerts
    default: op
  aegis.bypass:
    description: Bypass AegisAC checks
    default: false
  aegis.ip:
    description: View online player's server-seen IP address
    default: op
