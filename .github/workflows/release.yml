name: Build and release AegisAC

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Validate JAR
        run: |
          JAR='target/AegisAC-0.2.0-alpha.jar'
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'dev/aegisac/core/AegisAC.class'
          jar tf "$JAR" | grep -q '^plugin.yml$'
          unzip -t "$JAR"
          sha256sum "$JAR" | tee target/AegisAC-0.2.0-alpha.jar.sha256

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: AegisAC-0.2.0-alpha
          path: |
            target/AegisAC-0.2.0-alpha.jar
            target/AegisAC-0.2.0-alpha.jar.sha256

      - name: Create/update prerelease and upload verified artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.2.0-alpha'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/AegisAC-0.2.0-alpha.jar target/AegisAC-0.2.0-alpha.jar.sha256 --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title 'AegisAC 0.2.0-alpha' \
              --prerelease \
              --notes 'Experimental Paper 1.21.11 build with remote interaction guard and optional moderation/VPN controls. Automatic bans and kicks remain disabled by default. Test on a private server.' \
              target/AegisAC-0.2.0-alpha.jar \
              target/AegisAC-0.2.0-alpha.jar.sha256
          fi
